name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 9 * * *"   # 9am UTC daily — regression checks
  workflow_dispatch:       # manual trigger for interview demos

jobs:

  # ── LINT & VALIDATE ──────────────────────────────────────────────────────────
  validate:
    name: Lint & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install ruff pytest requests==2.32.5 apache-airflow==3.1.8 apache-airflow-providers-databricks==7.10.0 databricks-sdk==0.157.0 aiofiles

      - name: Lint Python files
        run: ruff check .

      - name: Offline export and payment regression checks
        run: python -m pytest tests -q

      - name: Validate Airflow DAG
        env:
          AIRFLOW__CORE__LOAD_EXAMPLES: "false"
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'airflow/include')
          from airflow.models import DagBag
          bag = DagBag(dag_folder='airflow/dags')
          errors = bag.import_errors
          if errors:
              for path, err in errors.items():
                  print(f'ERROR in {path}: {err}')
              sys.exit(1)
          dags = list(bag.dags.keys())
          print(f'DAGs loaded: {dags}')
          assert 'specialtypulse_annual_pipeline' in bag.dags, 'DAG not found'
          dag = bag.dags['specialtypulse_annual_pipeline']
          task_ids = [t.task_id for t in dag.tasks]
          print(f'Tasks: {task_ids}')
          assert 'validate_inputs' in task_ids
          assert 'run_databricks_pipeline' in task_ids
          assert 'publish_dashboard_export'     in task_ids
          assert 'notify_success'   in task_ids
          print('DAG validation passed')
          "

      - name: Validate notebook syntax
        run: |
          for f in databricks/notebooks/*.py; do
            echo "Checking $f..."
            # Strip Databricks magic lines (%pip, %sql, etc.) before compiling
            sed '/^%/d' "$f" > /tmp/_nb_check.py
            python -m py_compile /tmp/_nb_check.py && echo "  OK"
          done


  spark-reconciliation:
    name: Shared Spark pipeline reconciliation
    runs-on: ubuntu-latest
    env:
      SPARK_LOCAL_IP: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pip install pyspark==4.0.1 pytest
      - name: Execute shared transformation regressions
        run: python -m pytest tests/test_spark_pipeline.py -q
      - name: Reproduce every public mart row from raw inputs
        run: python scripts/run_local_pipeline.py --check

  # ── REACT DASHBOARD BUILD ───────────────────────────────────────────────────────────
  app-build:
    name: React dashboard build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: domo/app/package.json

      - name: Install app dependencies
        working-directory: domo/app
        run: npm install

      - name: Dashboard regression checks
        working-directory: domo/app
        run: npm test

      - name: Build React dashboard
        working-directory: domo/app
        run: npm run build

      - name: Verify build output
        working-directory: domo/app
        run: |
          test -f dist/index.html
          test -n "$(find dist -maxdepth 1 -name 'bundle.*.js' -print -quit)"
